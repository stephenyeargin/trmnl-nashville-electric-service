---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: node
polling_url: https://www.nespower.com/outagemap/getall
polling_headers: accept=application/json
polling_body: ''
id: 112378
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: life
  description: Show the number of customers without power in Nashville, Tennessee
  github_url: https://github.com/stephenyeargin/trmnl-nashville-electric-service
  learn_more_url: https://www.nespower.com
  email_address: stephen@yearg.in
- keyname: thunderforest_api_key
  field_type: password
  name: Thunderforest API Key
  description: (optional, recommended) Use for <a href="https://www.thunderforest.com/maps/mobile-atlas/" class="underline">nicer looking maps</a>
  placeholder: ABCDefg1234
  optional: true
name: Nashville Electric Service (NES)
description: Power outage map & status
refresh_interval: 15
